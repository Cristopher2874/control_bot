[project]
name = "pei-harness-workspace"
version = "0.1.0"
description = "Workspace del harness modular para modelos locales de Ollama"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "harness",
    "harness-cli",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/harness", "apps/cli"]

[tool.uv.sources]
harness = { workspace = true }
harness-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["packages", "apps", "lab"]
exclude = ["legacy", "**/__pycache__", "**/.venv"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = [
    "ollama: requiere un modelo real de Ollama (se corre aparte con -m ollama)",
]
